[build]
builder = "dockerfile"
dockerfile = "./Dockerfile"
watchPatterns = [
  "apps/api/**",
  "packages/shared-types/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "Dockerfile",
  ".dockerignore",
  "entrypoint.sh",
  "railway.toml"
]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 180
numReplicas = 1
