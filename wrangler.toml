name = "pymeshubsaas"
main = "apps/web/cloudflare-worker.js"
compatibility_date = "2024-01-01"
routes = [
  { pattern = "pymeshub.lat/*", zone_name = "pymeshub.lat" },
  { pattern = "www.pymeshub.lat/*", zone_name = "pymeshub.lat" }
]

[env.production]
name = "pymeshubsaas-prod"
routes = [
  { pattern = "pymeshub.lat", zone_name = "pymeshub.lat" },
  { pattern = "www.pymeshub.lat", zone_name = "pymeshub.lat" }
]

[assets]
directory = "apps/web/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
