name = "pymeshubsaas"
main = "worker/index.js"
compatibility_date = "2024-01-01"

[vars]
API_URL = "https://api.pymeshub.lat"
OPENAI_AGENT_WORKFLOW_ID = "wf_69ee50a4431881908f0c86097bc88c0b0e1d93fe68eecbd2"

[assets]
directory = "./apps/web/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
