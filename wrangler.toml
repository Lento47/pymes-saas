name = "pymeshubsaas"
main = "apps/web/cloudflare-worker.js"
compatibility_date = "2026-05-14"
workers_dev = true
preview_urls = true

# **Do not run `wrangler deploy` for this Worker.** The web is deployed by Cloudflare's Git
# integration, which builds and publishes on push to `master`. Running this command by hand
# makes a *second* writer race the automated one, and that race is not a no-op — it tears
# the asset manifest.
#
# The failure is worth knowing because it is quiet and it took the site down. Two deploys
# interleaving leaves an `index.html` that references an entry chunk the manifest does not
# contain. `/` still returns 200 and still serves a correct-looking page, every small asset
# still loads, and `not_found_handling = "single-page-application"` then answers
# `/assets/<entry>.js` with *that same HTML*. The browser asks for JavaScript, gets markup,
# and dies on a syntax error: a white screen, while any check that only looks at `/` passes.
# Only the largest object in the build was ever affected, so "most assets load" was true
# throughout.
#
# If the site is ever white after a push, check the entry chunk's `Content-Type` before
# anything else. It must be `text/javascript`, and its byte count must match the build.
# A `text/html` answer on a `.js` path is this bug, not a bad build.
#
# `--env production` is worse than useless here: it publishes to `pymeshubsaas-prod`, which
# `pymeshub.lat` is not served from. It exits 0, uploads every asset, and changes nothing.
# Do not "fix" that by adding `routes` to `[env.production]` — it was tried and Cloudflare
# refuses, because `pymeshub.lat/*` is already held by a Worker named `outage-worker` that
# is not in this repository (error 10020).
[env.production]
name = "pymeshubsaas-prod"

[observability.logs]
enabled = true

[assets]
directory = "apps/web/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Map archive, glyphs and sprite. The PMTiles file is far past the 25 MiB per-file cap
# that Workers static assets impose, so it lives in R2 and `cloudflare-worker.js` serves
# it over byte ranges. See `docs/technical/map-hosting.md`.
[[r2_buckets]]
binding = "MAP_ASSETS"
bucket_name = "pymeshub-map-assets"

[vars]
VITE_PAYPAL_CLIENT_ID = "AWLZKdmWHYdnDnif0OP6AiSlvUzS52dcW2YMmRWzChJbgZk56g8shj9jrFladrlR2i3_82qDfAyj2rg4"
