name = "pymeshubsaas"
main = "worker/index.js"
compatibility_date = "2024-01-01"
pages_build_output_dir = "./apps/web/dist/public"

[vars]
API_URL = "https://api.pymeshub.lat"

[assets]
directory = "./apps/web/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
