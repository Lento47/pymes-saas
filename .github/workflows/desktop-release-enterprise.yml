name: Desktop Release Enterprise

on:
  push:
    tags:
      - "desktop-enterprise-v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Desktop Enterprise Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build web frontend ────────────────────────────────────────────────
      - name: Build web frontend
        run: pnpm --filter rest-express build

      # ── Build and package NestJS API sidecar ──────────────────────────────
      - name: Build NestJS API
        working-directory: apps/api
        run: pnpm build

      - name: Generate Prisma client (SQLite / Windows)
        working-directory: apps/api
        run: npx prisma generate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: "file:./build-temp.db"

      - name: Generate SQLite schema SQL
        working-directory: apps/api
        run: |
          npx prisma migrate diff `
            --from-empty `
            --to-schema-datamodel prisma/schema.prisma `
            --script `
            | Out-File -FilePath dist/schema.sql -Encoding utf8
        env:
          DATABASE_URL: "file:./build-temp.db"

      - name: Package API as Windows sidecar executable
        working-directory: apps/api
        run: |
          npm install -g @yao-pkg/pkg
          New-Item -ItemType Directory -Force -Path ../desktop/src-tauri/binaries
          pkg dist/main.js `
            --config package.json `
            --target node20-win-x64 `
            --output ../desktop/src-tauri/binaries/api-x86_64-pc-windows-msvc.exe
        env:
          DATABASE_URL: "file:./build-temp.db"

      - name: Copy Prisma query engine alongside sidecar
        working-directory: apps/api
        run: |
          $engine = Get-ChildItem -Path node_modules/.prisma/client `
            -Filter "libquery_engine-windows.dll.node" -Recurse | Select-Object -First 1
          if ($engine) {
            Copy-Item $engine.FullName ../desktop/src-tauri/binaries/libquery_engine-windows.dll.node
            Write-Host "Copied Prisma engine: $($engine.FullName)"
          } else {
            Write-Warning "Prisma engine binary not found — SQLite queries may fail"
          }

      # ── Build Tauri installer ─────────────────────────────────────────────
      - name: Build and publish enterprise installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYMESHUB_EDITION: enterprise
          PYMESHUB_UPDATER_ACTIVE: "false"
          PYMESHUB_REMOTE_URL: ${{ vars.PYMESHUB_ENTERPRISE_URL }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Pymeshub Desktop Enterprise ${{ github.ref_name }}
          releaseBody: |
            ## Pymeshub Enterprise — ${{ github.ref_name }}

            Instalador offline para Windows. Incluye el backend NestJS, base de datos SQLite local y frontend completo.

            **Instalación:** Descargue el `.msi` o el `.exe` y ejecútelo.
            No requiere conexión a internet para funcionar.
          args: --config src-tauri/tauri.enterprise.conf.json
