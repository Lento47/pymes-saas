name: Desktop Release Cloud

on:
  push:
    tags:
      - "desktop-cloud-v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Desktop Cloud Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish cloud installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PYMESHUB_EDITION: cloud
          PYMESHUB_UPDATER_ACTIVE: true
          PYMESHUB_REMOTE_URL: ${{ vars.PYMESHUB_CLOUD_URL }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Pymeshub Desktop Cloud ${{ github.ref_name }}
          releaseBody: |
            Release automática del shell desktop cloud de Pymeshub.
          args: --config src-tauri/tauri.cloud.conf.json
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
