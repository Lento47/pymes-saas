name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main-web]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**.md'
  pull_request:
    branches: [main-web]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**.md'

jobs:
  branch-guard:
    name: Branch-path guard
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no forbidden paths
        run: |
          echo "==> Branch-path guard for main-web"
          FORBIDDEN=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^apps/api/|^pnpm-lock\.yaml$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::main-web MUST NOT contain apps/api/** or pnpm-lock.yaml changes"
            echo "Forbidden files:"
            echo "$FORBIDDEN"
            exit 1
          fi
          SHARED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^packages/shared-types/' || true)
          if [ -n "$SHARED" ]; then
            echo "::warning::shared-types change detected — ensure this is also pushed to main-api"
          fi
          echo "==> Branch-path guard passed"

  build-and-deploy:
    needs: branch-guard
    if: |
      always() &&
      (needs.branch-guard.result == 'success' || needs.branch-guard.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: "10"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web app
        run: cd apps/web && pnpm run check

      - name: Build web app
        run: cd apps/web && pnpm run build

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
