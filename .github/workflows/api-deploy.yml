# =============================================================================
# Deploy Pipeline — NestJS SaaS
# =============================================================================
# Secrets REQUERIDOS (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST  — IP o hostname del servidor de producción
#   DEPLOY_USER  — Usuario SSH (ej: ubuntu, deploy)
#   DEPLOY_KEY   — Clave SSH privada (RSA o ED25519, sin passphrase)
#   DATABASE_URL — PostgreSQL connection string de producción
#   JWT_SECRET   — Secret para firmar tokens JWT
# =============================================================================

name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            set -euo pipefail
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api"

            echo "==> Autenticando en ghcr.io..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            echo "==> Pulling nueva imagen..."
            docker pull "${IMAGE}:${{ github.sha }}"

            echo "==> Actualizando imagen latest localmente..."
            docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:latest"

            echo "==> Actualizando stack con zero-downtime..."
            cd /opt/app
            docker compose pull api
            docker compose up -d --no-deps api

            echo "==> Ejecutando migraciones Prisma..."
            docker exec api pnpm exec prisma migrate deploy

            echo "==> Deploy completado exitosamente."
            echo "    Imagen: ghcr.io/${{ github.repository }}/api:${{ github.sha }}"
            echo "    Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify deployment health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            set -euo pipefail

            APP_URL="${APP_URL:-http://localhost:3000}"
            MAX_RETRIES=10
            RETRY_INTERVAL=6
            count=0

            echo "==> Health check: esperando que la API responda..."
            until curl -sf "${APP_URL}/api/health" > /dev/null 2>&1; do
              count=$((count + 1))
              if [ "$count" -ge "$MAX_RETRIES" ]; then
                echo "ERROR: Health check falló después de $((MAX_RETRIES * RETRY_INTERVAL))s."
                exit 1
              fi
              echo "    Intento $count/$MAX_RETRIES — reintentando en ${RETRY_INTERVAL}s..."
              sleep "$RETRY_INTERVAL"
            done

            echo "==> API respondiendo correctamente. Deploy exitoso."
