# =============================================================================
# Deploy Pipeline — NestJS SaaS
# =============================================================================
# Secrets REQUERIDOS (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST  — IP o hostname del servidor de producción
#   DEPLOY_USER  — Usuario SSH (ej: ubuntu, deploy)
#   DEPLOY_KEY   — Clave SSH privada (RSA o ED25519, sin passphrase)
#   DATABASE_URL — PostgreSQL connection string de producción
#   JWT_SECRET   — Secret para firmar tokens JWT
# =============================================================================

name: Deploy

on:
  push:
    branches:
      - main-api

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Info — Context
        run: |
          echo "🔍 Deploy Context"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Actor:     ${{ github.actor }}"
          echo "  Image:     ${{ env.IMAGE }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Verbose build output
          build-args: |
            BUILDKIT_PROGRESS=plain

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            set -euo pipefail
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api"

            echo "============================================"
            echo "==> 🔍 Deploy Info"
            echo "    Image:    ${IMAGE}"
            echo "    SHA:      ${{ github.sha }}"
            echo "    Time:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "    Host:     $(hostname)"
            echo "============================================"

            echo "==> Autenticando en ghcr.io..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin 2>&1 | tail -1

            echo "==> Pulling nueva imagen..."
            docker pull "${IMAGE}:${{ github.sha }}" 2>&1

            echo "==> Imagen actual:"
            docker images "${IMAGE}" --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}\t{{.CreatedAt}}"

            echo "==> Actualizando stack con zero-downtime..."
            cd /opt/app
            docker compose pull api 2>&1
            docker compose up -d --no-deps api 2>&1

            echo "==> Estado de contenedores:"
            docker compose ps

            echo "==> Ejecutando migraciones Prisma..."
            docker exec api pnpm exec prisma migrate deploy 2>&1

            echo "==> Logs recientes del contenedor:"
            docker logs api --tail 20

            echo "============================================"
            echo "==> ✅ Deploy completado exitosamente."
            echo "    Imagen: ${IMAGE}:${{ github.sha }}"
            echo "    Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "============================================"

      - name: Verify deployment health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            set -euo pipefail

            APP_URL="${APP_URL:-http://localhost:3000}"
            MAX_RETRIES=10
            RETRY_INTERVAL=6
            count=0

            echo "==> Health check: esperando que la API responda..."
            until curl -sv "${APP_URL}/api/health" 2>&1 | tee /tmp/health.log | grep -q "200\|ok\|healthy"; do
              count=$((count + 1))
              if [ "$count" -ge "$MAX_RETRIES" ]; then
                echo "ERROR: Health check falló después de $((MAX_RETRIES * RETRY_INTERVAL))s."
                echo "Último intento:"
                cat /tmp/health.log
                echo "Logs del contenedor:"
                docker logs api --tail 30
                exit 1
              fi
              echo "    Intento $count/$MAX_RETRIES — reintentando en ${RETRY_INTERVAL}s..."
              sleep "$RETRY_INTERVAL"
            done

            echo "==> ✅ API respondiendo correctamente. Deploy exitoso."
