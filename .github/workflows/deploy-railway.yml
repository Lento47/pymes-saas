name: Deploy to Railway

on:
  push:
    branches: [main-api]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - 'railway.toml'
  pull_request:
    branches: [main-api]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pymeshub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: cd apps/api && pnpm exec prisma generate

      - name: Build API
        run: cd apps/api && npm run build

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pymeshub_test
          JWT_SECRET: test-secret-for-ci-jwt-min-32-chars
        run: cd apps/api && npm run test

      - name: Healthcheck — start API and verify /api/health
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pymeshub_test
          JWT_SECRET: test-secret-for-ci-jwt-min-32-chars
          PORT: 4000
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          node apps/api/dist/src/main &
          APP_PID=$!
          echo "Waiting for NestJS to start (PID: $APP_PID)..."

          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null 2>&1; then
              echo "✅ Healthcheck passed after ${i}s"
              kill $APP_PID 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "❌ NestJS process crashed during startup"
              exit 1
            fi
            sleep 1
          done

          echo "❌ Healthcheck timed out after 30s"
          kill $APP_PID 2>/dev/null || true
          exit 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main-api'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: railway-app/cli-action@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: pymeshub-api
          environment: production
