name: CI - Build Check

on:
  push:
    branches: [main-api]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - 'railway.toml'
      - '.github/workflows/deploy-railway.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v2
        with:
          version: latest

      - run: pnpm install --no-frozen-lockfile

      - run: cd apps/api && npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pymeshub_test

      - run: cd apps/api && pnpm exec nest build
