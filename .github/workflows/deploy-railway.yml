name: Deploy to Railway

on:
  push:
    branches: [main-api]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - 'railway.toml'
      - 'packages/shared-types/**'
      - '.github/workflows/deploy-railway.yml'
  pull_request:
    branches: [main-api]

jobs:
  branch-guard:
    name: Branch-path guard
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no forbidden paths
        run: |
          echo "==> Branch-path guard for main-api"
          FORBIDDEN=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^apps/web/' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::main-api MUST NOT contain apps/web/** changes"
            echo "Forbidden files:"
            echo "$FORBIDDEN"
            exit 1
          fi
          SHARED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^packages/shared-types/' || true)
          if [ -n "$SHARED" ]; then
            echo "::warning::shared-types change detected — ensure this is also pushed to main-web"
          fi
          echo "==> Branch-path guard passed"

  build-and-test:
    needs: branch-guard
    if: |
      always() &&
      (needs.branch-guard.result == 'success' || needs.branch-guard.result == 'skipped')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pymeshub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: "10"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: cd apps/api && npm run build

      - name: Lint API
        run: cd apps/api && npm run lint
        continue-on-error: true

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main-api'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service pymes-saasAPI --environment production --detach
