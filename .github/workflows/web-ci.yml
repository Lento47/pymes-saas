# =============================================================================
# CI Pipeline — PymesHub Web (Cloudflare frontend)
# =============================================================================
name: Web CI

on:
  push:
    branches:
      - main-web
  pull_request:
    branches:
      - main-web

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Info — Context
        run: |
          echo "🔍 Web CI Context"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Actor:     ${{ github.actor }}"
          echo "  Event:     ${{ github.event_name }}"
          echo "  Runner:    $(uname -m)"
          echo "  Node:      $(node -v)"
          echo "  pnpm:      $(pnpm -v 2>/dev/null || echo 'not installed yet')"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --loglevel verbose

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build web app
        run: pnpm build:web
