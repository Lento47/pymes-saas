name: Engineering Fix Agent

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: 'Support diagnostic case ID'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    name: Investigate & Fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: cd apps/api && pnpm exec prisma generate

      - name: Build API
        run: pnpm --filter saas-api run build

      - name: Fetch diagnostic case
        id: fetch_case
        env:
          CASE_ID: ${{ github.event.inputs.case_id }}
        run: |
          echo "Fetching diagnostic case $CASE_ID"
          echo "case_id=$CASE_ID" >> "$GITHUB_OUTPUT"

      - name: Analyze affected module
        env:
          CASE_ID: ${{ steps.fetch_case.outputs.case_id }}
        run: |
          echo "==> Engineering Fix Agent — case: $CASE_ID"
          echo "Module and error details are embedded in the diagnostic case."
          echo "See /api/agent/diagnostic-cases/$CASE_ID for full context."

      - name: Create fix branch
        run: |
          BRANCH="fix/${{ github.event.inputs.case_id }}"
          git checkout -b "$BRANCH"
          echo "Branch: $BRANCH"

      - name: Run typecheck
        run: pnpm --filter saas-api run build 2>&1 | tail -5
        continue-on-error: true

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix: engineering fix — case ${{ github.event.inputs.case_id }}"
          branch: "fix/${{ github.event.inputs.case_id }}"
          title: "Engineering Fix — ${{ github.event.inputs.case_id }}"
          body: |
            ## Engineering Fix Agent

            **Diagnostic case:** `${{ github.event.inputs.case_id }}`

            ### Evidence
            See diagnostic case for full reproduction steps, error codes, and module context.

            ### Risk classification
            To be reviewed by human.

            ### Rollback
            `git revert <this-commit>`

            ---
            *Generated by Engineering Fix Agent — requires human review before merge.*
          labels: "engineering-fix,automated"
