name: Engineering Fix Agent

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: 'Support diagnostic case ID'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  investigate:
    name: Investigate & Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: cd apps/api && pnpm exec prisma generate

      - name: Run Engineering Fix Agent
        id: agent
        env:
          CASE_ID: ${{ github.event.inputs.case_id }}
        run: node scripts/run-engineering-fix-agent.cjs

      - name: Create fix branch
        run: |
          BRANCH="fix/${{ github.event.inputs.case_id }}"
          git checkout -b "$BRANCH"
          echo "Branch: $BRANCH"

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "fix: engineering investigation — case ${{ github.event.inputs.case_id }}"
          branch: "fix/${{ github.event.inputs.case_id }}"
          title: "Engineering Fix — ${{ github.event.inputs.case_id }}"
          body-path: pr-body.md
          labels: "engineering-fix,automated"
