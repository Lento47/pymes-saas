name: Engineering Fix Agent

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: 'Support diagnostic case ID'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  investigate:
    name: Investigate & Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: cd apps/api && pnpm exec prisma generate

      - name: Run Engineering Fix Agent
        id: agent
        env:
          CASE_ID: ${{ github.event.inputs.case_id }}
        run: node scripts/run-engineering-fix-agent.cjs

      - name: Create fix branch
        run: |
          BRANCH="fix/${{ github.event.inputs.case_id }}"
          git checkout -b "$BRANCH"
          echo "Branch: $BRANCH"

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix: engineering investigation — case ${{ github.event.inputs.case_id }}"
          branch: "fix/${{ github.event.inputs.case_id }}"
          title: "Engineering Fix — ${{ github.event.inputs.case_id }}"
          body-path: pr-body.md
          labels: "engineering-fix,automated"
