name: Desktop Cargo Audit

# Surfaces RustSec advisories for the Tauri desktop crate (apps/desktop/src-tauri).
# The npm side is covered by pnpm; this watches the Cargo dependency tree, which
# Dependabot also scans (alerts against apps/desktop/src-tauri/Cargo.lock).

on:
  push:
    branches: [master]
    paths:
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - ".github/workflows/desktop-audit.yml"
  pull_request:
    paths:
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - ".github/workflows/desktop-audit.yml"
  schedule:
    # Weekly re-scan so newly published advisories surface without a code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (Tauri crate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo.lock
        working-directory: apps/desktop/src-tauri
        run: cargo audit
