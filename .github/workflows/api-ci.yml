# =============================================================================
# CI Pipeline — NestJS SaaS (pnpm + Prisma + PostgreSQL 16)
# =============================================================================
name: CI

on:
  push:
    branches:
      - main
      - main-api
      - develop
  pull_request:
    branches:
      - main
      - main-api

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Info — Context
        run: |
          echo "🔍 CI Context"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Actor:     ${{ github.actor }}"
          echo "  Event:     ${{ github.event_name }}"
          echo "  Runner:    $(uname -m)"
          echo "  Node:      $(node -v)"
          echo "  pnpm:      $(pnpm -v 2>/dev/null || echo 'not installed yet')"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --loglevel verbose

      - name: Info — Prisma version
        run: pnpm exec prisma --version

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Build (NestJS / TypeScript)
        run: pnpm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Info — Context
        run: |
          echo "🔍 CI Context"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  DB Host:   localhost:5432"
          echo "  DB Name:   test_db"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --loglevel verbose

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run Prisma migrations
        run: pnpm exec prisma migrate deploy

      - name: Run tests (verbose)
        run: pnpm test -- --verbose --detectOpenHandles
