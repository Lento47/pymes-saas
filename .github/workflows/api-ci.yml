# =============================================================================
# CI Pipeline — PymesHub API (NestJS + Prisma + PostgreSQL 16)
# =============================================================================
name: API CI

on:
  push:
    branches:
      - main-api
  pull_request:
    branches:
      - main-api

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate Prisma & Build API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Info — Context
        run: |
          echo "🔍 API CI Context"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Actor:     ${{ github.actor }}"
          echo "  Event:     ${{ github.event_name }}"
          echo "  Runner:    $(uname -m)"
          echo "  Node:      $(node -v)"
          echo "  pnpm:      $(pnpm -v 2>/dev/null || echo 'not installed yet')"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js 20 with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --loglevel verbose

      - name: Info — Prisma version
        run: pnpm exec prisma --version

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Build API (NestJS / TypeScript)
        run: pnpm run build

  test:
    name: API Tests with PostgreSQL
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Info — Context
        run: |
          echo "🔍 API Test Context"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  DB Host:   localhost:5432"
          echo "  DB Name:   test_db"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js 20 with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --loglevel verbose

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run Prisma migrations
        run: pnpm exec prisma migrate deploy

      - name: Run tests
        run: pnpm exec jest --verbose --detectOpenHandles --passWithNoTests
