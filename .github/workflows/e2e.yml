# =============================================================================
# E2E Tests — Playwright (10 critical flows)
# Runs on every push to main and on PRs targeting main.
# Blocks merge if any E2E test fails.
# =============================================================================
name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (10 critical flows)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Postgres for the API
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pymeshub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis for queues and throttling
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pymeshub_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: e2e-test-secret-key-for-ci-only
      ENCRYPTION_KEY: e2e-test-encryption-key-32-chars!
      APP_URL: http://localhost:5000
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API migrations
        working-directory: apps/api
        run: pnpm prisma migrate deploy --schema ./prisma/schema.prisma

      - name: Seed test data
        working-directory: apps/api
        run: pnpm db:seed
        env:
          E2E_SEED: "true"

      - name: Build web app
        working-directory: apps/web
        run: pnpm build

      - name: Start API + Web in background
        run: |
          pnpm --filter saas-api start &
          pnpm --filter rest-express start &
          # Wait for both to become ready
          npx wait-on http://localhost:3000/health http://localhost:5000 --timeout 60000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          APP_URL: http://localhost:5000

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/report/
          retention-days: 14

      - name: Upload test results (failures only)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
